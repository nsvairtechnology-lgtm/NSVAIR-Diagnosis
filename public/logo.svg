<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NSVAIR Diagnosis — Powered by NSVAIR GROUP OF INDUSTRY">
  <defs>
    <linearGradient id="logoBgGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="45%" stop-color="#059669"/>
      <stop offset="85%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="logoPulseGrad" x1="40" y1="100" x2="160" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="210" y1="80" x2="650" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Emblem -->
  <rect x="20" y="20" width="160" height="160" rx="38" fill="url(#logoBgGrad)"/>
  <rect x="24" y="24" width="152" height="152" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Subtle Cross Watermark in Emblem -->
  <path d="M 90 55 H 110 V 85 H 140 V 105 H 110 V 135 H 90 V 105 H 60 V 85 H 90 Z" fill="#ffffff" fill-opacity="0.12"/>
  
  <!-- Pulse Line in Emblem -->
  <path d="M 38 108 L 64 108 L 76 80 L 92 136 L 108 64 L 122 120 L 134 98 L 142 108 L 162 108" 
        stroke="url(#logoPulseGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#logoGlow)"/>
  <circle cx="108" cy="64" r="3.5" fill="#ffffff"/>
  <circle cx="122" cy="120" r="3.5" fill="#fef08a"/>

  <!-- Star Sparkle on Emblem Top Right -->
  <path d="M 148 44 L 151 52 L 159 54 L 153 59 L 154 67 L 148 63 L 142 67 L 143 59 L 137 54 L 145 52 Z" fill="#fbbf24"/>

  <!-- Brand Typography -->
  <!-- Main Title: NSVAIR DIAGNOSIS -->
  <text x="210" y="92" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.03em" fill="#0f172a">
    NSVAIR <tspan fill="url(#textGrad)">DIAGNOSIS</tspan>
  </text>

  <!-- Tagline / Subtitle Badge -->
  <rect x="210" y="112" width="530" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <circle cx="228" cy="129" r="4.5" fill="#10b981"/>
  <text x="242" y="134" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14.5" letter-spacing="0.08em" fill="#047857">
    POWERED BY NSVAIR GROUP OF INDUSTRY
  </text>
  
  <!-- Subtle Agentic AI Pill Badge -->
  <text x="212" y="174" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" letter-spacing="0.02em" fill="#64748b">
    Multi-Modal Agentic AI Health Screening &amp; Real-Time Diagnostics
  </text>
</svg>
